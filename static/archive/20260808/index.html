<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geva Kipper - Bioluminescent Cyber-Ocean</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #02050f;
            --bg-black: #000000;
            --glass-bg: rgba(10, 15, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e6ed;
            
            /* Tentacle Colors */
            --c1: #ff007f; /* Neon Pink */
            --c2: #ff8c00; /* Amber Orange */
            --c3: #0077ff; /* Electric Blue */
            --c4: #b026ff; /* Neon Purple */
            --c5: #00ffaa; /* Mint Green */
            --c6: #00ffff; /* Cyan */
            --c7: #ff00ff; /* Magenta */
            --c8: #e0e0e0; /* Silver/White */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-deep) 0%, var(--bg-black) 100%);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            perspective: 1000px;
        }

        /* SVG Background Layer for Tentacles */
        #ocean-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .tentacle-path {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor);
            transition: stroke-width 0.3s ease;
        }

        /* Central Head */
        #octopus-head {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 2.5rem 3rem;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 120, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.05);
            max-width: 600px;
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #octopus-head::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0, 255, 255, 0.03) 10px, rgba(0, 255, 255, 0.03) 20px);
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #fff 0%, #a0b0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle-1 {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #a9b5c5;
            line-height: 1.5;
        }

        .subtitle-2 {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-style: italic;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            animation: pulseText 3s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; text-shadow: 0 0 5px rgba(0, 243, 255, 0.3); }
            100% { opacity: 1; text-shadow: 0 0 15px rgba(0, 243, 255, 0.8); }
        }

        /* Nodes Container */
        #nodes-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .node-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Orb State */
        .orb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--c);
            box-shadow: 0 0 15px var(--c), 0 0 30px var(--c), inset 0 0 10px rgba(255,255,255,0.8);
            cursor: pointer;
            transition: all 0.4s ease;
            position: absolute;
        }

        /* Card State */
        .card {
            position: absolute;
            width: 320px;
            height: auto;
            min-height: 200px;
            background: rgba(15, 20, 35, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 3px solid var(--c);
            border-radius: 16px;
            padding: 20px;
            opacity: 0;
            transform: scale(0.1);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(var(--c-rgb), 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        .node-wrapper:hover .orb {
            transform: scale(0);
            opacity: 0;
        }

        .node-wrapper:hover .card {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--c);
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(var(--c-rgb), 0.4);
            z-index: 2;
        }

        .card-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #c0c8d0;
            margin-bottom: 20px;
            flex-grow: 1;
            z-index: 2;
        }

        .card-links {
            display: flex;
            gap: 10px;
            z-index: 2;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--c);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--c);
            color: #000;
            box-shadow: 0 0 15px var(--c);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Card Visual Backgrounds (CSS Art) */
        .card-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            border-radius: inherit;
        }

        /* GlglStats */
        #card-0 .card-bg {
            background: repeating-linear-gradient(90deg, transparent, transparent 5px, var(--c1) 5px, var(--c1) 8px);
            mask-image: linear-gradient(to top, transparent, black);
            -webkit-mask-image: linear-gradient(to top, transparent, black);
            animation: waveform 2s infinite alternate ease-in-out;
        }
        @keyframes waveform { 0% { background-position: 0 50px; } 100% { background-position: 0 -10px; } }

        /* Ahuzat Dibuk */
        #card-1 .card-bg {
            background: radial-gradient(circle at 20% 80%, red, transparent 40%),
                        radial-gradient(circle at 80% 20%, yellow, transparent 40%),
                        radial-gradient(circle at 50% 50%, orange, transparent 60%);
            filter: blur(10px);
        }

        /* 2D Part Orienting */
        #card-2 .card-bg {
            background-image: 
                linear-gradient(var(--c3) 1px, transparent 1px),
                linear-gradient(90deg, var(--c3) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg) translateY(-50px) translateZ(-200px);
            animation: gridMove 10s linear infinite;
        }
        @keyframes gridMove { to { background-position: 0 30px; } }

        /* The Turing Jest */
        #card-3 .card-bg::after {
            content: "🎭";
            font-size: 150px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.2;
            filter: drop-shadow(0 0 10px var(--c4)) grayscale(1) sepia(1) hue-rotate(240deg);
        }

        /* Rhymes of Israel */
        #card-4 .card-bg {
            background: #fff;
            opacity: 0.05;
            background-image: repeating-linear-gradient(transparent, transparent 19px, rgba(0,0,0,0.5) 20px);
        }
        #card-4 .card-bg::before {
            content: "✍️";
            font-size: 80px; position: absolute; bottom: -10px; right: 10px; transform: rotate(-15deg);
        }

        /* Hatul Basak */
        #card-5 .card-bg::after {
            content: "🧩";
            font-size: 120px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.2;
        }

        /* Meta Portfolio */
        #card-6 .card-bg::after {
            content: "∞";
            font-size: 200px;
            font-family: serif;
            color: var(--c7);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: spinInf 10s linear infinite;
        }
        @keyframes spinInf { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Connections */
        #card-7 .card { background: transparent; border: none; box-shadow: none; align-items: center; justify-content: center; }
        .social-3d-container { display: flex; gap: 30px; }
        .social-3d {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            display: flex; justify-content: center; align-items: center;
            color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            transform-style: preserve-3d;
        }
        .social-3d svg { width: 40px; height: 40px; fill: currentColor; transform: translateZ(20px); }
        .social-3d:hover {
            transform: translateY(-10px) rotateX(10deg) rotateY(-10deg);
            background: rgba(255,255,255,0.2);
            box-shadow: 0 15px 30px rgba(255,255,255,0.2), inset 0 0 20px rgba(255,255,255,0.5);
            color: var(--c8);
        }

        /* Focus Mode Mechanics */
        body.focused #octopus-head {
            opacity: 0.1;
            filter: blur(10px);
            pointer-events: none;
        }

        body.focused .node-wrapper:not(.active) {
            opacity: 0.1;
            filter: blur(8px);
            pointer-events: none;
        }

        body.focused .node-wrapper.active {
            z-index: 100;
        }

        body.focused .node-wrapper.active .orb { display: none; }
        
        body.focused .node-wrapper.active .card {
            opacity: 1;
            transform: scale(1.5);
            pointer-events: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 50px rgba(var(--c-rgb), 0.4);
        }

        #close-btn {
            position: fixed;
            top: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        #close-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
        body.focused #close-btn { opacity: 1; pointer-events: auto; }

        /* Ocean Floor / Bottom Bar */
        #ocean-floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .credit {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #timer-container {
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #timer-container span { font-size: 0.7rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            #octopus-head { padding: 1.5rem; width: 90%; }
            body.focused .node-wrapper.active .card { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <svg id="ocean-canvas">
        <!-- SVG filters for intense neon glow -->
        <defs>
            <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="8" result="blur1" />
                <feGaussianBlur stdDeviation="15" result="blur2" />
                <feMerge>
                    <feMergeNode in="blur2" />
                    <feMergeNode in="blur1" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
        <g id="tentacle-group"></g>
    </svg>

    <div id="octopus-head">
        <h1>Geva Kipper</h1>
        <div class="subtitle-1">Software Engineer currently building and solving challenges at Google.</div>
        <div class="subtitle-2">"This website is re-designed each day by AI and is thus ever-changing."</div>
    </div>

    <div id="nodes-container">
        <!-- Nodes injected by JS -->
    </div>

    <div id="close-btn">✕</div>

    <div id="ocean-floor">
        <div class="credit">Designed Daily by AI</div>
        <div id="timer-container">
            <span>Elapsed Time</span>
            <div id="timer">00:00:00</div>
        </div>
    </div>

    <script>
        // Data Structure for Tentacles
        const projectData = [
            {
                id: 0,
                color: 'var(--c1)', colorRgb: '255, 0, 127',

                links: [

                    { text: 'PyData TLV', url: 'https://www.youtube.com/watch?v=jrKAtOsj1Lo', icon: '<path d="M8 5v14l11-7z"/>' }

            },
            {

                links: [
                    { text: 'Channel 13', url: 'https://13tv.co.il/item/news/domestic/internal/parking-902956407/', icon: '<path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>' },
                    { text: 'Mako', url: 'https://www.mako.co.il/nexter-news/Article-ae43964b891bf71027.htm', icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>' },
                    { text: 'Secret TLV', url: 'https://www.facebook.com/groups/secrettelaviv/posts/10159636301195943/', icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-5h2v5zm0-7h-2V8h2v2zm3 7h-2v-5h2v5zm0-7h-2V8h2v2z"/>' }
                ]
            },
            {
                id: 2,
                color: 'var(--c3)', colorRgb: '0, 119, 255',
                title: '2D Part Orienting',
                desc: 'A robust C++ computational geometry library implementing a complex push-plan algorithm for orienting polygonal parts on a conveyor.',
                links: [
                    { text: 'Documentation & Code', url: 'https://www.cgl.cs.tau.ac.il/projects/2d-part-orienting/' }
                ]
            },
            {
                id: 3,
                color: 'var(--c4)', colorRgb: '176, 38, 255',
                title: 'The Turing Jest',
                desc: 'An LMSYS-style arena where cutting-edge LLMs compete to generate and explain puns, blindly judged by human users.',
                links: [
                    { text: 'Judge Puns', url: 'https://jest.geekip.dev', icon: '<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>' }
                ]
            },
            {
                id: 4,
                color: 'var(--c5)', colorRgb: '0, 255, 170',
                title: 'Rhymes of Israel',
                desc: 'A comedic Chrome extension utilizing an LLM backend to automatically rewrite Israeli news headlines into poetic rhymes.',
                links: [
                    { text: 'Download Extension', url: 'https://chromewebstore.google.com/detail/eainginjgdkpgolpjniijdihfbeeeklb', icon: '<path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>' }

            },
            {
                id: 5,
                color: 'var(--c6)', colorRgb: '0, 255, 255',
                title: 'Hatul Basak',
                desc: 'The official Hebrew port of the Wikipedia-based trivia game. Features daily AI-generated challenge grids and user creations.',
                links: [
                    { text: 'Play Game', url: 'https://hatulbasak.geekip.dev', icon: '<path d="M8 5v14l11-7z"/>' }
                ]
            },
            {
                id: 6,
                color: 'var(--c7)', colorRgb: '255, 0, 255',
                title: 'The Meta Portfolio',
                desc: 'A recursive acknowledgment of this very website—a dynamically generated space re-imagined daily by artificial intelligence.',
                links: [
                    { text: 'Return to Source', url: 'https://geekip.dev' }
                ]
            },
            {
                id: 7,
                color: 'var(--c8)', colorRgb: '224, 224, 224',
                title: 'Connections',
                isSocial: true,
                links: [
                    { url: 'https://github.com/gevak', icon: '<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>' },
                    { url: 'https://linkedin.com/in/gevakip', icon: '<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>' },
                    { url: 'https://facebook.com/geva.kipper', icon: '<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>' }
                ]
            }
        ];

        const container = document.getElementById('nodes-container');
        const tentacleGroup = document.getElementById('tentacle-group');
        const octopusHead = document.getElementById('octopus-head');
        let activeNode = null;
        let isFocused = false;

        // Physics variables
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cx = window.innerWidth / 2;
        let cy = window.innerHeight / 2;
        
        // Nodes array to store physics data
        const nodes = [];

        // Initialization
        function init() {
            const radius = Math.min(window.innerWidth, window.innerHeight) * 0.38;
            
            projectData.forEach((data, i) => {
                const angle = (Math.PI * 2 / 8) * i - Math.PI / 2;
                
                // Base target positions for radial layout
                const tx = cx + Math.cos(angle) * radius;
                const ty = cy + Math.sin(angle) * radius;

                // Create HTML Element
                const el = document.createElement('div');
                el.className = 'node-wrapper';
                el.id = `node-${i}`;
                el.style.setProperty('--c', data.color);
                el.style.setProperty('--c-rgb', data.colorRgb);
                
                let cardContent = '';
                if(data.isSocial) {
                    cardContent = `<div class="card" id="card-${i}"><div class="social-3d-container">
                        ${data.links.map(l => `<a href="${l.url}" target="_blank" class="social-3d">${l.icon}</a>`).join('')}
                    </div></div>`;
                } else {
                    cardContent = `
                        <div class="card" id="card-${i}">
                            <div class="card-bg"></div>
                            <div class="card-title">${data.title}</div>
                            <div class="card-desc">${data.desc}</div>
                            <div class="card-links">
                                ${data.links.map(l => `
                                    <a href="${l.url}" target="_blank" class="btn ${l.icon ? 'icon-btn' : ''}" title="${l.text}">
                                        ${l.icon ? l.icon : l.text}
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                el.innerHTML = `
                    <div class="orb"></div>
                    ${cardContent}
                `;
                
                container.appendChild(el);

                // Create SVG Path
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "tentacle-path");
                path.setAttribute("stroke", data.color);
                tentacleGroup.appendChild(path);

                // Store node data
                nodes.push({
                    el, path, angle, radius,
                    tx, ty, // target x,y
                    x: tx, y: ty, // current x,y (springed)
                    vx: 0, vy: 0, // velocity
                    // Control points for bezier curve physics
                    cp1x: cx, cp1y: cy,
                    cp2x: tx, cp2y: ty
                });

                // Interaction Event
                el.addEventListener('click', (e) => {
                    // Prevent link clicks from triggering focus logic
                    if(e.target.closest('a')) return;
                    
                    if(!isFocused) {
                        focusNode(i);
                    }
                });
            });

            document.getElementById('close-btn').addEventListener('click', closeFocus);
            
            // Mouse tracking
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            window.addEventListener('resize', () => {
                cx = window.innerWidth / 2;
                cy = window.innerHeight / 2;
                const newRadius = Math.min(window.innerWidth, window.innerHeight) * 0.38;
                nodes.forEach(n => {
                    n.radius = newRadius;
                    n.tx = cx + Math.cos(n.angle) * n.radius;
                    n.ty = cy + Math.sin(n.angle) * n.radius;
                });
                if(isFocused && activeNode !== null) {
                    updateFocusTransform(activeNode);
                }
            });

            animate();
        }

        // Focus Logic
        function focusNode(index) {
            isFocused = true;
            activeNode = index;
            document.body.classList.add('focused');
            
            nodes.forEach((n, i) => {
                if(i === index) {
                    n.el.classList.add('active');
                    updateFocusTransform(i);
                    n.path.style.strokeWidth = 6;
                } else {
                    n.path.style.opacity = 0.2;
                }
            });
        }

        function updateFocusTransform(index) {
            const n = nodes[index];
            // Calculate translation needed to move element from its radial pos (n.tx, n.ty) to center (cx, cy)
            // Since element is absolute, its left/top is driven by JS. We just set its pos to center.
            // Wait, we animate its physical position variables.
            n.tx = cx;
            n.ty = cy;
        }

        function closeFocus() {
            document.body.classList.remove('focused');
            isFocused = false;
            activeNode = null;
            
            nodes.forEach((n, i) => {
                n.el.classList.remove('active');
                n.path.style.strokeWidth = 4;
                n.path.style.opacity = 1;
                // Reset target positions
                n.tx = cx + Math.cos(n.angle) * n.radius;
                n.ty = cy + Math.sin(n.angle) * n.radius;
            });
        }

        // Animation Loop (Physics & Rendering)
        function animate() {
            const time = Date.now() * 0.001;

            nodes.forEach((n, i) => {
                // Node Spring Physics to Target
                const dxNode = n.tx - n.x;
                const dyNode = n.ty - n.y;
                n.vx = (n.vx + dxNode * 0.05) * 0.7; // spring + friction
                n.vy = (n.vy + dyNode * 0.05) * 0.7;
                n.x += n.vx;
                n.y += n.vy;

                // Update HTML Element position
                n.el.style.left = `${n.x}px`;
                n.el.style.top = `${n.y}px`;

                // Calculate Bezier Control Points
                // Base rest positions for control points (1/3 and 2/3 along the line)
                const distCenterToNodeX = n.x - cx;
                const distCenterToNodeY = n.y - cy;
                
                let targetCp1x = cx + distCenterToNodeX * 0.33;
                let targetCp1y = cy + distCenterToNodeY * 0.33;
                let targetCp2x = cx + distCenterToNodeX * 0.66;
                let targetCp2y = cy + distCenterToNodeY * 0.66;

                // Add Ocean Sway (Sine waves)
                const swayAmt = isFocused ? 5 : 30; // Less sway when focused
                targetCp1x += Math.cos(time + i) * swayAmt;
                targetCp1y += Math.sin(time + i) * swayAmt;
                targetCp2x += Math.cos(time * 1.5 - i) * swayAmt;
                targetCp2y += Math.sin(time * 1.2 + i) * swayAmt;

                // Mouse Repulsion on Control Points (Physics based swaying)
                if(!isFocused) {
                    const mdx = mouseX - targetCp2x;
                    const mdy = mouseY - targetCp2y;
                    const mDist = Math.sqrt(mdx*mdx + mdy*mdy);
                    if(mDist < 250) {
                        const force = (250 - mDist) / 250;
                        targetCp2x -= (mdx / mDist) * force * 100;
                        targetCp2y -= (mdy / mDist) * force * 100;
                    }
                }

                // Smoothly update actual control points towards targets
                n.cp1x += (targetCp1x - n.cp1x) * 0.1;
                n.cp1y += (targetCp1y - n.cp1y) * 0.1;
                n.cp2x += (targetCp2x - n.cp2x) * 0.1;
                n.cp2y += (targetCp2y - n.cp2y) * 0.1;

                // Update SVG Path
                n.path.setAttribute("d", `M ${cx} ${cy} C ${n.cp1x} ${n.cp1y}, ${n.cp2x} ${n.cp2y}, ${n.x} ${n.y}`);
            });

            // Very subtle parallax for the center head based on mouse
            if(!isFocused) {
                const headOffX = (mouseX - cx) * 0.02;
                const headOffY = (mouseY - cy) * 0.02;
                octopusHead.style.transform = `translate(calc(-50% + ${headOffX}px), calc(-50% + ${headOffY}px))`;
            } else {
                octopusHead.style.transform = `translate(-50%, -50%) scale(0.9)`;
            }

            requestAnimationFrame(animate);
        }

        // Timer Logic
        const targetDate = new Date('2026-08-08T01:04:57').getTime();
        const timerEl = document.getElementById('timer');

        function updateTimer() {
            const now = Date.now();
            let diff = Math.floor(Math.abs(now - targetDate) / 1000);
            
            const s = diff % 60;
            const m = Math.floor(diff / 60) % 60;
            const h = Math.floor(diff / 3600);
            
            timerEl.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        
        setInterval(updateTimer, 1000);
        updateTimer();

        // Boot
        init();

    </script>
